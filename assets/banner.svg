    <circle cx="1120" cy="80" r="13"/>
    <circle cx="985" cy="260" r="13"/>
    <circle cx="1105" cy="275" r="13"/>
  </g>
  <circle cx="1040" cy="150" r="26" fill="#3fc6e0"/>
  <g transform="translate(1040 150)" fill="#0a2a45">
    <rect x="-12" y="-9" width="24" height="18" rx="4"/>
    <circle cx="-5" cy="0" r="2.6" fill="#3fc6e0"/>
