  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-size="15" font-weight="700" letter-spacing="2.4" fill="#6fe1f2">NETWORK ENGINEERING × ARTIFICIAL INTELLIGENCE</text>
    <text x="64" y="168" font-size="76" font-weight="800" letter-spacing="-2" fill="#ffffff">Packets &amp; Agents</text>
