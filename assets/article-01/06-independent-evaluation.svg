<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="445" viewBox="0 0 1400 445" role="img"><rect width="1400" height="445" rx="20" fill="#fffaf4"/><text x="700" y="55" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="35" font-weight="700">Who decides whether an agent succeeded?</text><rect x="45" y="100" width="605" height="255" rx="20" fill="#cce8fa" stroke="#17314d" stroke-width="3"/><rect x="750" y="100" width="605" height="255" rx="20" fill="#d6f2e8" stroke="#17314d" stroke-width="3"/><g stroke="#17314d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="113" y="187" width="64" height="45" rx="9"/><line x1="123" y1="203" x2="167" y2="203"/><circle cx="127" cy="220" r="3"/><circle cx="139" cy="220" r="3"/></g><g stroke="#17314d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M850 170 l32 11 v22 q0 29 -32 45 q-32 -16 -32 -45 v-22 Z"/><path d="M833 210 l11 12 l23 -25"/></g><text x="375" y="180" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="29" font-weight="700">Agent Under Test</text><text x="375" y="223" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Investigates the network</text><text x="375" y="257" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Uses authorized tools</text><text x="375" y="291" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Proposes a recovery</text><text x="1077" y="180" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="29" font-weight="700">Independent Evaluator</text><text x="1077" y="223" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Verifies network state</text><text x="1077" y="257" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Checks safety boundaries</text><text x="1077" y="291" fill="#17314d" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Measures reliability</text><path d="M670 230 h60 m-15 -15 l15 15 l-15 15" stroke="#17314d" stroke-width="5" fill="none" stroke-linecap="round"/><text x="700" y="408" fill="#526578" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="22" font-weight="500">The agent performs the task. The evaluator checks the evidence independently.</text></svg>